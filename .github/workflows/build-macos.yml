name: Build WhatsApp Bulk Sender for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

env:
  APP_NAME: WhatsAppBulkSender
  PYTHON_VERSION: '3.11'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: Intel-x86_64
          - runner: macos-15
            arch: Apple-Silicon-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Build macOS application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "$APP_NAME" \
            --collect-all pywhatkit \
            main.py

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${APP_NAME}.app" \
            "${APP_NAME}-macOS-${{ matrix.arch }}.zip"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-${{ matrix.arch }}
          path: ${{ env.APP_NAME }}-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
